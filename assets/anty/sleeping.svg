<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Antigravity mascot - sleeping" shape-rendering="crispEdges">
<title>Antigravity mascot - sleeping</title>

<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b66cff"/>
    <stop offset="1" stop-color="#55d9ff"/>
  </linearGradient>
  <linearGradient id="earGlow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a86bff"/>
    <stop offset="1" stop-color="#78cfff"/>
  </linearGradient>
</defs>


<!-- curled tail -->
<path d="M163 174h22v-12h18v12h13v19h-10v20h-18v10h-25v-10h-12v-20h12z" fill="#242131" stroke="#090812" stroke-width="7"/>
<path d="M181 178h18v13h-10v16h-17v-12h9z" fill="url(#accent)"/>
<!-- tucked body -->
<path d="M71 164h104v18h20v34h-15v16H84v-10H64v-38h7z" fill="#242131" stroke="#090812" stroke-width="7"/>
<!-- head and ears -->
<path d="M65 103V65h20V48h24v17h39V48h24v17h18v38h13v40h-16v15H68v-15H52v-40z" fill="#242131" stroke="#090812" stroke-width="7"/>
<path d="M77 91V69h13V57h12v34zM157 91V57h12v12h13v22z" fill="url(#earGlow)"/>
<!-- sleepy face -->
<path d="M92 122h16v8H92zM145 122h16v8h-16z" fill="#b98aff"/>
<path d="M119 139h10v8h-10z" fill="#8bdcff"/>
<!-- paws -->
<path d="M76 180h32v17H91v10H76zM143 180h32v17h-17v10h-15z" fill="#171522" stroke="#090812" stroke-width="5"/>
<!-- Zs -->
<path d="M193 54h20v7h-11v7h11v7h-20v-7h11v-7h-11z" fill="url(#accent)"/>
<path d="M215 34h13v5h-7v5h7v5h-13v-5h7v-5h-7z" fill="#b98aff"/>

</svg>
